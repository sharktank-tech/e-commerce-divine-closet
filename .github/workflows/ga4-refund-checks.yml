name: GA4 refund foundation checks
on:
  push:
    branches:
      - feature/ga4-refund-safe-foundation
  pull_request:
    paths:
      - "apps/web/src/lib/ga4-*"
      - "apps/web/src/lib/__tests__/ga4-*"
      - "apps/web/src/components/loja/TrackingScripts.tsx"
      - "apps/web/src/app/api/analytics/**"
      - "packages/database/prisma/**"
      - ".github/workflows/ga4-refund-checks.yml"
      - "scripts/ga4-prisma-drift-guard*"
      - "scripts/ga4-prisma-drift-preflight*"
      - "scripts/ga4-prisma-legacy-drift.baseline.json"
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/divine_ga4_test
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      JWT_SECRET: test-ga4-foundation-only-never-use-in-production-123
      GA4_REFUND_TRANSPORT_ENABLED: "false"
      GA4_CONCURRENCY_TEST_DB: "true"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: divine_ga4_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Prisma schema validation
        run: npx prisma validate --schema packages/database/prisma/schema.prisma
      - name: Migrate disposable PostgreSQL
        run: npx prisma migrate deploy --schema packages/database/prisma/schema.prisma
      - name: Test legacy drift guard logic
        run: node --test scripts/ga4-prisma-drift-guard.test.mjs
      - name: Guard legacy Prisma drift (block new differences)
        run: |
          # Permite execução APENAS no PostgreSQL descartável deste workflow.
          if [ "$DATABASE_URL" != "postgresql://postgres:postgres@localhost:5432/divine_ga4_test" ]; then
            echo "::error::Refusing drift check outside dedicated disposable database"
            exit 1
          fi
          set +e
          npx prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel packages/database/prisma/schema.prisma --exit-code > "$RUNNER_TEMP/ga4-prisma-drift.txt" 2>&1
          drift_exit=$?
          set -e
          cat "$RUNNER_TEMP/ga4-prisma-drift.txt"
          node scripts/ga4-prisma-drift-guard.mjs "$RUNNER_TEMP/ga4-prisma-drift.txt" "$drift_exit"
      - name: Validate read-only drift preflight on disposable PostgreSQL
        run: |
          if [ "$DATABASE_URL" != "postgresql://postgres:postgres@localhost:5432/divine_ga4_test" ]; then
            echo "::error::Refusing preflight outside disposable database"
            exit 1
          fi
          psql -X -v ON_ERROR_STOP=1 "$DATABASE_URL" -f scripts/ga4-prisma-drift-preflight.sql
      - name: Verify preflight detects synthetic anomalies
        run: bash scripts/ga4-prisma-drift-preflight.test.sh
      - name: Tests
        run: npm test -- --reporter=default
      - name: Typecheck
        if: always()
        run: npm run typecheck
      - name: Lint
        if: always()
        run: npm run lint
      - name: Build
        if: always()
        run: npm run build
